services:
  postgres:
    image: postgres:17
    container_name: data_to_sql
    volumes:
      - postgresql_data:/var/lib/postgresql/data
      - ./initdb.d:/docker-entrypoint-initdb.d
    env_file:
      - .env
    ports:
      - "5436:5432"
    networks:
      - postgres_network
volumes:
  postgresql_data:
    driver: local
networks:
  postgres_network:
    driver: bridge

